<!DOCTYPE composition PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN"
    "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<ui:composition xmlns="http://www.w3.org/1999/xhtml" xmlns:s="http://jboss.com/products/seam/taglib" xmlns:ui="http://java.sun.com/jsf/facelets"
	xmlns:f="http://java.sun.com/jsf/core" xmlns:h="http://java.sun.com/jsf/html" xmlns:rich="http://richfaces.org/rich"
	xmlns:c="http://java.sun.com/jsp/jstl/core" xmlns:fmt="http://java.sun.com/jsp/jstl/fmt" xmlns:a4j="http://richfaces.org/a4j"
	template="/layout/template.xhtml">
	<ui:define name="title">
		<h:outputText value="Geç Giren Raporu" />
	</ui:define>
	<ui:define name="body">

		<h:form id="formDevamsizlikRaporu">

			<rich:panel header="Geç Giren Raporu">
				<a4j:outputPanel ajaxRendered="true">
					<h:messages id="messages" styleClass="message" errorClass="errormsg" infoClass="infomsg" warnClass="warnmsg" />
				</a4j:outputPanel>

			</rich:panel>


			<a4j:outputPanel>
				<rich:panel id="devamsizlikPanel">
					<h:commandLink value="#{messages['ortak.etiket.excelAktar']}" action="#{devamsizlikRaporuHome.excelGecGirenAktar()}"
						rendered="#{not empty devamsizlikRaporuHome.vardiyaGunList}" />
					<rich:dataTable rowClasses="acik,koyu" value="#{devamsizlikRaporuHome.vardiyaGunList}" var="calismaPlani" 
						id="hareketTable">
						<f:facet name="header">
							<h:outputText value="Hareket Durumu" />
						</f:facet>
						<rich:column width="150">
							<f:facet name="header">
								<h:outputText value="#{ortakIslemler.sirketAciklama()}" />
							</f:facet>
							<h:outputText value="#{calismaPlani.personel.sirket.ad}" />
						</rich:column>
						<rich:column width="60" rendered="#{ortakIslemler.getListTesisDurum(devamsizlikRaporuHome.vardiyaGunList)}">
							<f:facet name="header">
								<h:outputText value="#{ortakIslemler.tesisAciklama()}" />
							</f:facet>
							<h:outputText value="#{calismaPlani.personel.tesis.aciklama}" />
						</rich:column>
						<rich:column width="60">
							<f:facet name="header">
								<h:outputText value="#{ortakIslemler.yoneticiAciklama()}" />
							</f:facet>
							<h:outputText value="#{calismaPlani.personel.yoneticisi.adSoyad}" />
						</rich:column>
						<rich:column width="150">
							<f:facet name="header">
								<h:outputText value="Personel" />
							</f:facet>
							<h:outputText value="#{calismaPlani.personel.adSoyad}" />
						</rich:column>
						<rich:column width="60" style="text-align:center">
							<f:facet name="header">
								<h:outputText value="#{ortakIslemler.personelNoAciklama()}" />
							</f:facet>
							<h:outputText value="#{calismaPlani.personel.sicilNo}" />
						</rich:column>
						<rich:column width="60">
							<f:facet name="header">
								<h:outputText value="#{devamsizlikRaporuHome.bolumAciklama}" />
							</f:facet>
							<h:outputText value="#{calismaPlani.personel.ekSaha3.aciklama}" />
						</rich:column>
						<rich:column width="30" style="text-align:center">
							<f:facet name="header">
								<h:outputText value="Tarih" />
							</f:facet>
							<h:outputText value="#{authenticatedUser.dateTimeFormatla(calismaPlani.islemVardiya.vardiyaBasZaman)}" />
						</rich:column>

						<rich:column width="30" style="text-align:center">
							<f:facet name="header">
								<h:outputText value="Giriş" />
							</f:facet>
							<h:outputText value="#{authenticatedUser.dateTimeFormatla(calismaPlani.girisHareket.orjinalZaman)}" />
						</rich:column>
						<rich:column width="30" style="text-align:center">
							<f:facet name="header">
								<h:outputText value="Fark" />

							</f:facet>
							<h:outputText value="#{devamsizlikRaporuHome.getSaatFarki(calismaPlani,null)}" />
						</rich:column>
						
					</rich:dataTable>

				</rich:panel>



			</a4j:outputPanel>


		</h:form>


	</ui:define>


</ui:composition>
