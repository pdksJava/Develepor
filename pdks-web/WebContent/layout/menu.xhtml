<rich:toolBar xmlns="http://www.w3.org/1999/xhtml" xmlns:ui="http://java.sun.com/jsf/facelets" xmlns:h="http://java.sun.com/jsf/html"
	xmlns:c="http://java.sun.com/jstl/core" xmlns:f="http://java.sun.com/jsf/core" xmlns:s="http://jboss.com/products/seam/taglib"
	xmlns:rich="http://richfaces.org/rich">
	<h:form id="menuIslemleri" rendered="#{userHome.hasPermission('menuIslemleri','view')}">
		<rich:dropDownMenu binding="#{menuLoaderAction.menuIslemleri}" />
	</h:form>
	<h:form id="admin" rendered="#{userHome.hasPermission('admin','view')}">
		<rich:dropDownMenu binding="#{menuLoaderAction.adminMenu}" />
	</h:form>

	<h:form id="kullaniciIslemleri" rendered="#{userHome.hasPermission('kullaniciIslemleri','view')}">
		<rich:dropDownMenu binding="#{menuLoaderAction.kullaniciIslemleri}" />
	</h:form>
	<h:form id="izinIslemleri"
		rendered="#{userHome.hasPermission('izinIslemleri','view') and ( authenticatedUser.izinGirebilir  or ortakIslemler.getIkRole(null) or ortakIslemler.getParameterKey('izinERPUpdate') != '1')}">
		<rich:dropDownMenu binding="#{menuLoaderAction.izinIslemleri}" />
	</h:form>
	<h:form id="puantajIslemleri" rendered="#{userHome.hasPermission('puantajIslemleri','view')}">
		<rich:dropDownMenu binding="#{menuLoaderAction.puantajIslemleri}" />
	</h:form>
	<h:form id="raporIslemleri" rendered="#{userHome.hasPermission('raporIslemleri','view')}">
		<rich:dropDownMenu binding="#{menuLoaderAction.raporIslemleri}" />
	</h:form>
	<c:if test="#{identity.loggedIn==false}">
		<rich:toolBarGroup location="center">
			<SPAN class="rich-label-text-decor"> <h:outputText value="#{ortakIslemler.getParameterKey('fromName')}" /></SPAN>
		</rich:toolBarGroup>
	</c:if>
	<c:if test="#{identity.loggedIn}">
		<rich:toolBarGroup location="right">



			<h:outputText value="Seçili #{ortakIslemler.yoneticiAciklama()} : #{authenticatedUser.seciliSuperVisor.adSoyad}"
				rendered="#{authenticatedUser.mudur and authenticatedUser.seciliSuperVisor != null}" />
			<h:outputText value="Seçili Super Visör : #{authenticatedUser.seciliSuperVisor.adSoyad}"
				rendered="#{authenticatedUser.superVisor and authenticatedUser.seciliSuperVisor != null}" />
			<DIV id="userInfo">
				<ui:fragment rendered="#{authenticatedUser.shortUsername != null and authenticatedUser.shortUsername != ''}">
					<h:outputText title="Kısa Kullanıcı : #{authenticatedUser.shortUsername}" value="#{authenticatedUser.adSoyad}" />
				</ui:fragment>
				<ui:fragment rendered="#{authenticatedUser.shortUsername == null or authenticatedUser.shortUsername == ''}">
					<h:outputText value="#{authenticatedUser.adSoyad}" />
				</ui:fragment>

			</DIV>
			<ui:fragment rendered="#{authenticatedUser.menuItemTime != null}">
				<rich:toolTip for="userInfo">
					<SPAN style="background-color: #{startupAction.projeHeaderBackgroundColor};color: #{startupAction.projeHeaderColor};font-size: 9px; "> #{authenticatedUser.menuItemTime.menu.description.aciklama} :
						<ui:fragment rendered="#{authenticatedUser.menuItemTime.useCount > 0}"> #{authenticatedUser.sayiFormatliGoster(authenticatedUser.menuItemTime.useCount)} --></ui:fragment>
						#{authenticatedUser.dateTimeFormatla(authenticatedUser.menuItemTime.lastTime)}
					</SPAN>
				</rich:toolTip>
			</ui:fragment>
			<s:link view="#{menuItemConstant.home}" value="Ana Sayfa" propagation="none" />

			<s:link view="#{menuItemConstant.login}" action="#{identity.logout}" value="Çıkış" propagation="none" />


		</rich:toolBarGroup>
	</c:if>
</rich:toolBar>
